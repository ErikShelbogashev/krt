name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check --refresh-dependencies --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-mismatches
          path: build/reports/golden/**/*.png
          if-no-files-found: ignore

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Resolve build, runtime and development tools from a cold checkout
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/krt-offline-gradle
        run: ./gradlew --offline --no-daemon classes testClasses jmhJar compileGpuSmokeKotlin hotRunArgfile createDistributable

      - name: Start a normal build with empty caches and an unreachable proxy
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/krt-disconnected-gradle
          JAVA_TOOL_OPTIONS: -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=1 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=1
        timeout-minutes: 5
        run: ./gradlew --no-daemon --no-configuration-cache classes
